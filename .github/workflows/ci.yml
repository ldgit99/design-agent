name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m py_compile api/index.py api/routes/lesson.py api/schemas/lesson.py api/services/card_repository.py api/services/orchestrator.py api/services/openai_client.py api/config.py

  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install
      - name: Type check placeholder
        run: npx tsc --noEmit
